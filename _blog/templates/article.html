<article class="blog-article wrap">
  <nav class="article-links" aria-label="Blog navigation"><a class="blog-back" href="/blog.html">All articles</a><a class="blog-contribute" href="/contribute.html">Contribute a blog</a></nav>
  <header class="article-heading">
    <p class="blog-kicker">$category</p>
    <h1>$title</h1>
    <div class="article-byline"><span>Written by <a href="#about-author" rel="author">$author</a></span><time datetime="$date">$published</time>$modified</div>
    <p class="article-description">$description</p>
  </header>
  $image
  <div class="article-body">$body</div>
  <div class="article-tags" aria-label="Article tags">$tags</div>
  <aside class="about-author" id="about-author" aria-labelledby="author-heading">$portrait<div><h2 id="author-heading">About the author</h2><h3>$author</h3><p>$bio</p>$website</div></aside>
</article>
